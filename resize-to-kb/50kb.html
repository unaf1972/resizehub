  <style>

      --card: #ffffff;

    body {

    nav.site {

<body>

<header class="site">
  <h1>Resize Image to 50KB</h1>
  <p>Exact KB targeting for NADRA CNIC, FPSC, IBPS forms. 100% private — no upload.</p>
</header>

<nav class="site">
  <a href="/">Home</a>
  <a href="/tools/resize-to-kb/20kb.html">20KB</a>
  <a href="/tools/resize-to-kb/50kb.html">50KB</a>
  <a href="/">100KB (soon)</a>
</nav>

<main>
  <div class="card">
    <div class="field">
      <label for="preset">Preset</label>
      <select id="preset">
        <option value="50,200,200">FPSC Photo (200×200, 50KB)</option>
        <option value="50,200,230">IBPS Photo (200×230, 50KB)</option>
        <option value="50,413,531">NADRA CNIC (413×531, 50KB)</option>
        <option value="50,0,0">Custom (keep dimensions)</option>
      </select>
    </div>

    <div class="field">
      <label for="fileInput">Choose image</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="field">
      <label for="targetKb">Target size (KB)</label>
      <input type="number" id="targetKb" value="50" min="1" max="5000">
    </div>

    <button id="processBtn" disabled>Resize to Exact KB</button>

    <div id="status">Upload an image to begin.</div>
    <img id="preview" alt="Preview">
    <a id="downloadLink" href="#" download>Download Resized Image</a>
  </div>

  <p class="note">
    Works fully in your browser. No server upload. Free for single images.
  </p>
</main>

<footer class="site">
  Designed &amp; built by Nasir Naqvi
</footer>

<script>
  const fileInput = document.getElementById('fileInput');
  const targetKb = document.getElementById('targetKb');
  const preset = document.getElementById('preset');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('downloadLink');

  let originalImg = null;
  let originalFileName = 'image';

  preset.addEventListener('change', () => {
    const parts = preset.value.split(',');
    if (parts[0] && parts[0] !== '0') targetKb.value = parts[0];
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    originalFileName = file.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      originalImg = img;
      preview.src = url;
      preview.style.display = 'block';
      downloadLink.style.display = 'none';
      processBtn.disabled = false;
      statusEl.textContent = 'Loaded: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    };

    img.onerror = () => {
      statusEl.textContent = 'Could not load this image. Try JPG or PNG.';
    };

    img.src = url;
  });

  processBtn.addEventListener('click', async () => {
    if (!originalImg) return;

    const targetKB = parseFloat(targetKb.value);
    if (!targetKB || targetKB <= 0) {
      statusEl.textContent = 'Enter a valid KB target.';
      return;
    }

    const targetBytes = targetKB * 1024;
    processBtn.disabled = true;
    statusEl.textContent = 'Processing…';

    try {
      const result = await resizeToTarget(originalImg, targetBytes);

      if (!result) {
        statusEl.textContent = 'Could not reach ' + targetKB + ' KB. Try a higher target or a smaller image.';
        processBtn.disabled = false;
        return;
      }

      const blobUrl = URL.createObjectURL(result.blob);
      downloadLink.href = blobUrl;
      downloadLink.download = originalFileName + '-' + targetKB + 'kb.jpg';
      downloadLink.style.display = 'block';
      preview.src = blobUrl;
      statusEl.textContent = 'Done: ' + (result.blob.size / 1024).toFixed(1) + ' KB at quality ' + result.quality.toFixed(2) + '.';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Something went wrong. Try another image.';
    }

    processBtn.disabled = false;
  });

  async function resizeToTarget(img, targetBytes) {
    let width = img.naturalWidth;
    let height = img.naturalHeight;
    let scale = 1;
    let bestBlob = null;
    let bestQuality = 0.8;

    for (let attempt = 0; attempt < 14; attempt++) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      let low = 0.01;
      let high = 0.99;
      let localBest = null;
      let localQuality = 0.8;

      for (let i = 0; i < 8; i++) {
        const mid = (low + high) / 2;
        const blob = await canvasToBlob(canvas, 'image/jpeg', mid);

        if (blob.size <= targetBytes) {
          localBest = blob;
          localQuality = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      if (localBest) {
        bestBlob = localBest;
        bestQuality = localQuality;
        break;
      }

      scale *= 0.85;
      if (canvas.width < 60 || canvas.height < 60) break;
    }

    return bestBlob ? { blob: bestBlob, quality: bestQuality } : null;
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((resolve) => {
      canvas.toBlob(resolve, type, quality);
    });
  }
</script>

</body>
</html>
