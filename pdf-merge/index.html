<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge PDF Files Online - ResizeHub</title>
  <meta name="description" content="Merge multiple PDF files into one, right in your browser. Free, private, no upload.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YF9S33NXBS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YF9S33NXBS');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .tool-card { background: var(--rh-surface); border: 1px solid var(--rh-border); border-radius: var(--rh-radius-lg); padding: 28px; box-shadow: var(--rh-shadow); }
    .tool-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; color: var(--rh-text); }
    .tool-card .subtitle { color: var(--rh-muted); font-size: 0.95rem; margin: 0 0 22px; }
    .tool-badge { display: inline-block; padding: 5px 12px; background: rgba(37,99,235,0.08); color: var(--rh-primary-dark); border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 14px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; color: var(--rh-text); }
    .field input[type="file"], .field input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid var(--rh-border); border-radius: 10px; font-size: 1rem; background: #fff; font-family: inherit; color: var(--rh-text); transition: border-color 0.15s, box-shadow 0.15s; }
    .field input:focus { outline: none; border-color: var(--rh-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .btn-primary { background: linear-gradient(135deg, var(--rh-primary) 0%, var(--rh-primary-light) 100%); color: #fff; border: none; padding: 14px 22px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; box-shadow: 0 4px 14px rgba(37,99,235,0.25); transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.32); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    #status { margin-top: 16px; font-size: 0.93rem; color: var(--rh-muted); min-height: 22px; text-align: center; }
    #downloadLink { display: none; margin-top: 18px; text-align: center; background: linear-gradient(135deg, #ecfdf5, #dbeafe); color: var(--rh-primary-dark); padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(37,99,235,0.2); }
    #downloadLink:hover { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .file-list { margin-top: 12px; border: 1px solid var(--rh-border); border-radius: 10px; background: #fff; overflow: hidden; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--rh-border); font-size: 0.92rem; }
    .file-item:last-child { border-bottom: none; }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
    .file-item .size { color: var(--rh-muted); font-size: 0.85rem; margin-right: 12px; }
    .file-item button.remove { background: #fbe6e6; color: #b12929; padding: 5px 10px; width: auto; font-size: 0.8rem; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; }
    .empty-msg { padding: 14px; color: var(--rh-muted); font-size: 0.9rem; text-align: center; }
    .tool-note { max-width: 720px; margin: 22px auto 0; font-size: 0.85rem; color: var(--rh-muted); text-align: center; line-height: 1.6; }
    .tool-note strong { color: var(--rh-primary-dark); }
  </style>
</head>
<body>
<main class="rh-main-tool">
  <div class="tool-card">
    <span class="tool-badge">Combine files</span>
    <h1>Merge PDF</h1>
    <p class="subtitle">Combine multiple PDF files into one. Nothing is uploaded.</p>

    <div class="field">
      <label for="fileInput">Choose PDF files (multiple allowed)</label>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple>
    </div>

    <div id="fileList" class="file-list"><div class="empty-msg">No files added yet.</div></div>

    <div class="field" style="margin-top: 18px;">
      <label for="outputName">Output filename (without .pdf)</label>
      <input type="text" id="outputName" value="merged">
    </div>

    <button class="btn-primary" id="processBtn" disabled>Merge PDFs</button>
    <div id="status">Add at least 2 PDF files to begin.</div>
    <a id="downloadLink" href="#" download>Download Merged PDF</a>
  </div>
  <p class="tool-note"><strong>100% private.</strong> Files never leave your device.</p>
</main>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const outputName = document.getElementById('outputName');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const downloadLink = document.getElementById('downloadLink');
  let files = [];

  fileInput.addEventListener('change', (e) => {
    files = files.concat(Array.from(e.target.files));
    renderList();
    fileInput.value = '';
  });

  function renderList() {
    fileList.innerHTML = '';
    if (files.length === 0) {
      fileList.innerHTML = '<div class="empty-msg">No files added yet.</div>';
      processBtn.disabled = true;
      statusEl.textContent = 'Add at least 2 PDF files to begin.';
      downloadLink.style.display = 'none';
      return;
    }
    files.forEach((file, index) => {
      const row = document.createElement('div');
      row.className = 'file-item';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = file.name;
      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = (file.size / 1024).toFixed(1) + ' KB';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = 'Remove';
      removeBtn.addEventListener('click', () => { files.splice(index, 1); renderList(); });
      row.appendChild(name); row.appendChild(size); row.appendChild(removeBtn);
      fileList.appendChild(row);
    });
    processBtn.disabled = files.length < 2;
    statusEl.textContent = files.length + ' file(s) ready.';
  }

  processBtn.addEventListener('click', async () => {
    if (files.length < 2) return;
    processBtn.disabled = true;
    statusEl.textContent = 'Merging...';
    try {
      const { PDFDocument } = PDFLib;
      const mergedPdf = await PDFDocument.create();
      for (const file of files) {
        const arrayBuffer = await file.arrayBuffer();
        const srcDoc = await PDFDocument.load(arrayBuffer);
        const copiedPages = await mergedPdf.copyPages(srcDoc, srcDoc.getPageIndices());
        copiedPages.forEach((page) => mergedPdf.addPage(page));
      }
      const mergedBytes = await mergedPdf.save();
      const blob = new Blob([mergedBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      downloadLink.download = (outputName.value || 'merged').trim() + '.pdf';
      downloadLink.style.display = 'block';
      statusEl.textContent = 'Done: ' + (blob.size / 1024).toFixed(1) + ' KB total.';
    } catch (err) { console.error(err); statusEl.textContent = 'Merge failed. Check that all files are valid PDFs.'; }
    processBtn.disabled = false;
  });
</script>
<script src="/assets/js/site.js"></script>
</body>
</html>
