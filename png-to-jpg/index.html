<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNG to JPG Converter - ResizeHub</title>
  <meta name="description" content="Convert PNG images to JPG online. Free, private, no upload.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CKBKJ6MEWP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CKBKJ6MEWP');
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .tool-card { background: var(--rh-surface); border: 1px solid var(--rh-border); border-radius: var(--rh-radius-lg); padding: 28px; box-shadow: var(--rh-shadow); }
    .tool-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; color: var(--rh-text); }
    .tool-card .subtitle { color: var(--rh-muted); font-size: 0.95rem; margin: 0 0 22px; }
    .tool-badge { display: inline-block; padding: 5px 12px; background: rgba(37,99,235,0.08); color: var(--rh-primary-dark); border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 14px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; color: var(--rh-text); }
    .field input[type="file"], .field input[type="number"] { width: 100%; padding: 12px 14px; border: 1px solid var(--rh-border); border-radius: 10px; font-size: 1rem; background: #fff; font-family: inherit; color: var(--rh-text); transition: border-color 0.15s, box-shadow 0.15s; }
    .field input:focus { outline: none; border-color: var(--rh-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .btn-primary { background: linear-gradient(135deg, var(--rh-primary) 0%, var(--rh-primary-light) 100%); color: #fff; border: none; padding: 14px 22px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; box-shadow: 0 4px 14px rgba(37,99,235,0.25); transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.32); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    #status { margin-top: 16px; font-size: 0.93rem; color: var(--rh-muted); min-height: 22px; text-align: center; }
    #preview { display: none; max-width: 100%; max-height: 340px; margin: 18px auto 0; border-radius: 12px; border: 1px solid var(--rh-border); object-fit: contain; background: #f1f5f9; padding: 8px; }
    #downloadLink { display: none; margin-top: 18px; text-align: center; background: linear-gradient(135deg, #ecfdf5, #dbeafe); color: var(--rh-primary-dark); padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(37,99,235,0.2); }
    #downloadLink:hover { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .tool-note { max-width: 720px; margin: 22px auto 0; font-size: 0.85rem; color: var(--rh-muted); text-align: center; line-height: 1.6; }
    .tool-note strong { color: var(--rh-primary-dark); }
  </style>
</head>
<body>
<main class="rh-main-tool">
  <div class="tool-card">
    <span class="tool-badge">Fast conversion</span>
    <h1>PNG to JPG Converter</h1>
    <p class="subtitle">Convert PNG images to JPG for form uploads. Optionally target a specific file size. Nothing is uploaded.</p>

    <div class="field">
      <label for="fileInput">Choose a PNG image</label>
      <input type="file" id="fileInput" accept="image/png,.png">
    </div>

    <div class="field">
      <label for="targetKb">Target size (KB) - leave 0 to keep original quality</label>
      <input type="number" id="targetKb" value="0" min="0" max="5000">
    </div>

    <button class="btn-primary" id="processBtn" disabled>Convert to JPG</button>

    <div id="status">Upload a PNG to begin.</div>
    <img id="preview" alt="Preview">
    <a id="downloadLink" href="#" download>Download JPG</a>
  </div>
  <p class="tool-note"><strong>100% private.</strong> Your file is processed entirely in your browser and never sent to a server.</p>
</main>

<script>
  const fileInput = document.getElementById('fileInput');
  const targetKb = document.getElementById('targetKb');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('downloadLink');
  let originalImg = null;
  let originalFileName = 'image';

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    originalFileName = file.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      originalImg = img;
      preview.src = url;
      preview.style.display = 'block';
      downloadLink.style.display = 'none';
      processBtn.disabled = false;
      statusEl.textContent = 'Loaded: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    };
    img.onerror = () => { statusEl.textContent = 'Could not load this image.'; };
    img.src = url;
  });

  processBtn.addEventListener('click', async () => {
    if (!originalImg) return;
    const targetKB = parseFloat(targetKb.value) || 0;
    processBtn.disabled = true;
    statusEl.textContent = 'Converting...';
    try {
      const canvas = document.createElement('canvas');
      canvas.width = originalImg.naturalWidth;
      canvas.height = originalImg.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalImg, 0, 0);
      let blob;
      if (targetKB > 0) blob = await compressToTarget(canvas, targetKB * 1024);
      else blob = await canvasToBlob(canvas, 'image/jpeg', 0.92);
      if (!blob) { statusEl.textContent = 'Could not reach target. Try a higher KB.'; processBtn.disabled = false; return; }
      const blobUrl = URL.createObjectURL(blob);
      downloadLink.href = blobUrl;
      downloadLink.download = originalFileName + '.jpg';
      downloadLink.style.display = 'block';
      preview.src = blobUrl;
      statusEl.textContent = 'Done: ' + (blob.size / 1024).toFixed(1) + ' KB as JPG.';
    } catch (err) { console.error(err); statusEl.textContent = 'Conversion failed.'; }
    processBtn.disabled = false;
  });

  async function compressToTarget(canvas, targetBytes) {
    let low = 0.01, high = 0.99, bestBlob = null;
    for (let i = 0; i < 8; i++) {
      const mid = (low + high) / 2;
      const blob = await canvasToBlob(canvas, 'image/jpeg', mid);
      if (blob.size <= targetBytes) { bestBlob = blob; low = mid; } else { high = mid; }
    }
    return bestBlob;
  }
  function canvasToBlob(canvas, type, quality) {
    return new Promise((resolve) => canvas.toBlob(resolve, type, quality));
  }
</script>
<script src="/assets/js/site.js"></script>
</body>
</html>
