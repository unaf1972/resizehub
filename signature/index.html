<!DOCTYPE html>

  <style>
    :root {
      --primary: #0b6e4f;
      --primary-dark: #07543c;
      --bg: #f7f9f8;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5f6b66;
      --border: #dde5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;

      display: flex;
      flex-direction: column;

    header.site {
      max-width: 860px;
      margin: 0 auto 24px;
      text-align: center;
    }
    header.site h1 {
      font-size: 1.7rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    header.site p {
      color: var(--muted);
      font-size: 0.95rem;
    }
    nav.site {
      max-width: 860px;
      margin: 0 auto 24px;
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.95rem;
    }
    nav.site a {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 600;
    }
    nav.site a:hover { text-decoration: underline; }
    main { flex: 1; }
    .card {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    input[type="file"],
    input[type="number"],
    input[type="range"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      font-family: inherit;
    }
    input[type="range"] { padding: 0; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      font-family: inherit;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--muted);
      min-height: 22px;
    }
    #preview {
      display: none;
      max-width: 100%;
      max-height: 320px;
      margin: 18px auto 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      object-fit: contain;
      background: #f0f0f0;
    }
    #downloadLink {
      display: none;
      margin-top: 16px;
      text-align: center;
      background: #e8f5ef;
      color: var(--primary-dark);
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
    #downloadLink:hover { background: #d4ede0; }
    .note {
      max-width: 860px;
      margin: 22px auto 0;
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
    }
    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .range-row span {
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 45px;
      text-align: right;
    }
    footer.site {
      max-width: 860px;
      margin: 40px auto 0;
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 600px) {
      header.site h1 { font-size: 1.4rem; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>

<header class="site">
  <h1>Signature Resize for Govt Forms</h1>
  <p>Exact dimensions and KB for UPSC, IBPS, FPSC. 100% private — no upload.</p>
</header>

<nav class="site">
  <a href="/">Home</a>
  <a href="/resize-to-kb/20kb.html">20KB</a>
  <a href="/resize-to-kb/50kb.html">50KB</a>
  <a href="/resize-to-kb/100kb.html">100KB</a>
</nav>

<main>
  <div class="card">
    <div class="field">
      <label for="preset">Preset</label>
      <select id="preset">
        <option value="140,60,20">UPSC Signature (140×60, 20KB)</option>
        <option value="140,60,15">IBPS Signature (140×60, 15KB)</option>
        <option value="140,60,10">IBPS Signature (140×60, 10KB)</option>
        <option value="0,0,0">Custom</option>
      </select>
    </div>

    <div class="field">
      <label for="fileInput">Choose signature image</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="field">
      <label for="widthInput">Width (px)</label>
      <input type="number" id="widthInput" value="140" min="20" max="2000">
    </div>

    <div class="field">
      <label for="heightInput">Height (px)</label>
      <input type="number" id="heightInput" value="60" min="20" max="2000">
    </div>

    <div class="field">
      <label for="threshold">Background cleanup (higher = whiter background)</label>
      <div class="range-row">
        <input type="range" id="threshold" min="0" max="255" value="180">
        <span id="thresholdVal">180</span>
      </div>
    </div>

    <div class="field">
      <label for="targetKb">Target size (KB)</label>
      <input type="number" id="targetKb" value="20" min="1" max="1000">
    </div>

    <button id="processBtn" disabled>Resize Signature</button>

    <div id="status">Upload a signature image to begin.</div>
    <img id="preview" alt="Preview">
    <a id="downloadLink" href="#" download>Download Signature</a>
  </div>

  <p class="note">
    Works fully in your browser. No server upload. Free for single images.
  </p>
</main>

<footer class="site">
  Designed &amp; built by Nasir Naqvi
</footer>

<script>
  const fileInput = document.getElementById('fileInput');
  const widthInput = document.getElementById('widthInput');
  const heightInput = document.getElementById('heightInput');
  const targetKb = document.getElementById('targetKb');
  const preset = document.getElementById('preset');
  const threshold = document.getElementById('threshold');
  const thresholdVal = document.getElementById('thresholdVal');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('downloadLink');

  let originalImg = null;
  let originalFileName = 'signature';

  preset.addEventListener('change', () => {
    const parts = preset.value.split(',').map(Number);
    if (parts[0] === 0) return;
    widthInput.value = parts[0];
    heightInput.value = parts[1];
    targetKb.value = parts[2];
  });

  threshold.addEventListener('input', () => {
    thresholdVal.textContent = threshold.value;
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    originalFileName = file.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      originalImg = img;
      preview.src = url;
      preview.style.display = 'block';
      downloadLink.style.display = 'none';
      processBtn.disabled = false;
      statusEl.textContent = 'Loaded: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    };

    img.onerror = () => {
      statusEl.textContent = 'Could not load this image. Try JPG or PNG.';
    };

    img.src = url;
  });

  processBtn.addEventListener('click', async () => {
    if (!originalImg) return;

    const w = parseInt(widthInput.value);
    const h = parseInt(heightInput.value);
    const targetKB = parseFloat(targetKb.value);
    const th = parseInt(threshold.value);

    if (!w || !h || !targetKB) {
      statusEl.textContent = 'Fill in width, height and KB target.';
      return;
    }

    processBtn.disabled = true;
    statusEl.textContent = 'Processing…';

    try {
      const result = await processSignature(originalImg, w, h, th, targetKB * 1024);

      if (!result) {
        statusEl.textContent = 'Could not reach ' + targetKB + ' KB. Try a higher target.';
        processBtn.disabled = false;
        return;
      }

      const blobUrl = URL.createObjectURL(result.blob);
      downloadLink.href = blobUrl;
      downloadLink.download = originalFileName + '-signature.jpg';
      downloadLink.style.display = 'block';
      preview.src = blobUrl;
      statusEl.textContent = 'Done: ' + w + '×' + h + ' at ' + (result.blob.size / 1024).toFixed(1) + ' KB (quality ' + result.quality.toFixed(2) + ').';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Something went wrong. Try another image.';
    }

    processBtn.disabled = false;
  });

  async function processSignature(img, targetW, targetH, thresholdVal, targetBytes) {
    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, targetW, targetH);
    ctx.drawImage(img, 0, 0, targetW, targetH);

    const imageData = ctx.getImageData(0, 0, targetW, targetH);
    const data = imageData.data;

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const brightness = (r + g + b) / 3;
      if (brightness > thresholdVal) {
        data[i] = 255;
        data[i + 1] = 255;
        data[i + 2] = 255;
      } else {
        data[i] = 0;
        data[i + 1] = 0;
        data[i + 2] = 0;
      }
    }
    ctx.putImageData(imageData, 0, 0);

    let low = 0.01;
    let high = 0.99;
    let bestBlob = null;
    let bestQuality = 0.8;

    for (let i = 0; i < 8; i++) {
      const mid = (low + high) / 2;
      const blob = await canvasToBlob(canvas, 'image/jpeg', mid);

      if (blob.size <= targetBytes) {
        bestBlob = blob;
        bestQuality = mid;
        low = mid;
      } else {
        high = mid;
      }
    }

    return bestBlob ? { blob: bestBlob, quality: bestQuality } : null;
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise((resolve) => {
      canvas.toBlob(resolve, type, quality);
    });
  }
</script>

</body>
</html>
