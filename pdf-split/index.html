<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split PDF Online - ResizeHub</title>
  <meta name="description" content="Split a PDF or extract page ranges, right in your browser. Free, private, no upload.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YF9S33NXBS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YF9S33NXBS');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .tool-card { background: var(--rh-surface); border: 1px solid var(--rh-border); border-radius: var(--rh-radius-lg); padding: 28px; box-shadow: var(--rh-shadow); }
    .tool-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; color: var(--rh-text); }
    .tool-card .subtitle { color: var(--rh-muted); font-size: 0.95rem; margin: 0 0 22px; }
    .tool-badge { display: inline-block; padding: 5px 12px; background: rgba(37,99,235,0.08); color: var(--rh-primary-dark); border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 14px; }
    .info { background: linear-gradient(135deg, #eff6ff, #ecfeff); border: 1px solid rgba(37,99,235,0.15); border-radius: 12px; padding: 12px 16px; font-size: 0.88rem; color: var(--rh-primary-dark); margin-bottom: 18px; line-height: 1.5; display: none; }
    .info.show { display: block; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; color: var(--rh-text); }
    .field input[type="file"], .field input[type="text"], .field select { width: 100%; padding: 12px 14px; border: 1px solid var(--rh-border); border-radius: 10px; font-size: 1rem; background: #fff; font-family: inherit; color: var(--rh-text); transition: border-color 0.15s, box-shadow 0.15s; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--rh-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .btn-primary { background: linear-gradient(135deg, var(--rh-primary) 0%, var(--rh-primary-light) 100%); color: #fff; border: none; padding: 14px 22px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; box-shadow: 0 4px 14px rgba(37,99,235,0.25); transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.32); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    #status { margin-top: 16px; font-size: 0.93rem; color: var(--rh-muted); min-height: 22px; text-align: center; }
    #downloadLink { display: none; margin-top: 18px; text-align: center; background: linear-gradient(135deg, #ecfdf5, #dbeafe); color: var(--rh-primary-dark); padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(37,99,235,0.2); }
    #downloadLink:hover { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .tool-note { max-width: 720px; margin: 22px auto 0; font-size: 0.85rem; color: var(--rh-muted); text-align: center; line-height: 1.6; }
    .tool-note strong { color: var(--rh-primary-dark); }
  </style>
</head>
<body>
<main class="rh-main-tool">
  <div class="tool-card">
    <span class="tool-badge">Extract pages</span>
    <h1>Split PDF</h1>
    <p class="subtitle">Extract a page range or split every page into separate PDFs. Nothing is uploaded.</p>

    <div class="field">
      <label for="fileInput">Choose a PDF file</label>
      <input type="file" id="fileInput" accept="application/pdf,.pdf">
    </div>

    <div id="info" class="info"></div>

    <div class="field">
      <label for="mode">Split mode</label>
      <select id="mode">
        <option value="range">Extract page range (e.g. 2-5)</option>
        <option value="every">Split every page into separate files</option>
      </select>
    </div>

    <div class="field" id="rangeField">
      <label for="rangeInput">Page range (e.g. 1-3)</label>
      <input type="text" id="rangeInput" value="1-1">
    </div>

    <button class="btn-primary" id="processBtn" disabled>Split PDF</button>
    <div id="status">Upload a PDF to begin.</div>
    <a id="downloadLink" href="#" download>Download Result</a>
    <div id="multiList" style="margin-top: 16px;"></div>
  </div>
  <p class="tool-note"><strong>100% private.</strong> Files never leave your device.</p>
</main>

<script>
  const fileInput = document.getElementById('fileInput');
  const info = document.getElementById('info');
  const mode = document.getElementById('mode');
  const rangeField = document.getElementById('rangeField');
  const rangeInput = document.getElementById('rangeInput');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const downloadLink = document.getElementById('downloadLink');
  const multiList = document.getElementById('multiList');
  let sourcePdfBytes = null;
  let sourceName = 'document';
  let sourcePageCount = 0;

  mode.addEventListener('change', () => {
    rangeField.style.display = mode.value === 'range' ? 'block' : 'none';
    downloadLink.style.display = 'none';
    multiList.innerHTML = '';
  });

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    sourceName = file.name.replace(/\.[^.]+$/, '');
    statusEl.textContent = 'Reading PDF...';
    processBtn.disabled = true;
    downloadLink.style.display = 'none';
    multiList.innerHTML = '';
    try {
      const { PDFDocument } = PDFLib;
      const arrayBuffer = await file.arrayBuffer();
      sourcePdfBytes = arrayBuffer;
      const pdfDoc = await PDFDocument.load(arrayBuffer);
      sourcePageCount = pdfDoc.getPageCount();
      info.classList.add('show');
      info.innerHTML = '<strong>Loaded:</strong> ' + file.name + ' - ' + sourcePageCount + ' page(s) - ' + (file.size / 1024).toFixed(1) + ' KB';
      rangeInput.value = '1-' + sourcePageCount;
      processBtn.disabled = false;
      statusEl.textContent = 'Ready. Choose a mode and click Split PDF.';
    } catch (err) { console.error(err); statusEl.textContent = 'Could not read this PDF.'; sourcePdfBytes = null; }
  });

  processBtn.addEventListener('click', async () => {
    if (!sourcePdfBytes) return;
    processBtn.disabled = true;
    downloadLink.style.display = 'none';
    multiList.innerHTML = '';
    try {
      if (mode.value === 'range') await splitRange();
      else await splitEveryPage();
    } catch (err) { console.error(err); statusEl.textContent = 'Something went wrong.'; }
    processBtn.disabled = false;
  });

  async function splitRange() {
    const { PDFDocument } = PDFLib;
    const match = rangeInput.value.trim().match(/^(\d+)\s*-\s*(\d+)$/);
    if (!match) { statusEl.textContent = 'Use format like 1-3.'; return; }
    let start = parseInt(match[1]);
    let end = parseInt(match[2]);
    if (start < 1 || end < 1 || start > sourcePageCount || end > sourcePageCount || start > end) {
      statusEl.textContent = 'Range must be within 1 and ' + sourcePageCount + '.';
      return;
    }
    statusEl.textContent = 'Extracting pages ' + start + ' to ' + end + '...';
    const srcDoc = await PDFDocument.load(sourcePdfBytes);
    const newDoc = await PDFDocument.create();
    const pagesToCopy = [];
    for (let i = start - 1; i <= end - 1; i++) pagesToCopy.push(i);
    const copied = await newDoc.copyPages(srcDoc, pagesToCopy);
    copied.forEach((p) => newDoc.addPage(p));
    const bytes = await newDoc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    downloadLink.download = sourceName + '-pages-' + start + 'to' + end + '.pdf';
    downloadLink.style.display = 'block';
    statusEl.textContent = 'Done: ' + (blob.size / 1024).toFixed(1) + ' KB.';
  }

  async function splitEveryPage() {
    const { PDFDocument } = PDFLib;
    statusEl.textContent = 'Splitting all ' + sourcePageCount + ' pages...';
    const srcDoc = await PDFDocument.load(sourcePdfBytes);
    for (let i = 0; i < sourcePageCount; i++) {
      const newDoc = await PDFDocument.create();
      const [copied] = await newDoc.copyPages(srcDoc, [i]);
      newDoc.addPage(copied);
      const bytes = await newDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = sourceName + '-page-' + (i + 1) + '.pdf';
      link.textContent = 'Download page ' + (i + 1) + ' (' + (blob.size / 1024).toFixed(1) + ' KB)';
      link.style.display = 'block';
      link.style.marginTop = '8px';
      link.style.padding = '10px';
      link.style.background = '#e8f5ef';
      link.style.color = '#1e3a8a';
      link.style.borderRadius = '8px';
      link.style.textDecoration = 'none';
      link.style.fontWeight = '700';
      multiList.appendChild(link);
    }
    statusEl.textContent = 'Done. Click any link above to download.';
  }
</script>
<script src="/assets/js/site.js"></script>
</body>
</html>
