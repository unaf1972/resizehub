<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>HEIC to JPG Converter – ResizeHub</title>
  <meta name="description" content="Convert iPhone HEIC photos to JPG, PNG or WebP online. Free, private, no upload.">

  <style>
    :root {
      --primary: #0b6e4f;
      --primary-dark: #07543c;
      --bg: #f7f9f8;
      --card: #ffffff;

    body {

      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;

      display: flex;
      flex-direction: column;
    }
    header.site {
      max-width: 860px;
      margin: 0 auto 24px;
      text-align: center;
    }
    header.site h1 {
      font-size: 1.7rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    header.site p {
      color: var(--muted);
      font-size: 0.95rem;
    }
    nav.site {
      max-width: 860px;
      margin: 0 auto 24px;
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.95rem;
    }
    nav.site a {
      color: var(--primary-dark);
      text-decoration: none;

    }
    nav.site a:hover { text-decoration: underline; }
    main { flex: 1; }
    .card {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    input[type="file"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      font-family: inherit;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px 22px;
      border-radius: 10px;

    button:hover { background: var(--primary-dark); }

      margin-top: 14px;

    #preview {
      display: none;
      max-width: 100%;
      max-height: 320px;

      border: 1px solid var(--border);

      display: none;

    @media (max-width: 600px) {

<body>

<header class="site">
  <h1>HEIC to JPG Converter</h1>
  <p>Convert iPhone HEIC photos to JPG, PNG or WebP. 100% private — no upload.</p>
</header>

<nav class="site">
  <a href="/">Home</a>
  <a href="/resize-to-kb/20kb.html">20KB</a>
  <a href="/resize-to-kb/50kb.html">50KB</a>
  <a href="/resize-to-kb/100kb.html">100KB</a>
  <a href="/signature/">Signature</a>
  <a href="/passport-photo/pakistan.html">Passport</a>
</nav>

<main>
  <div class="card">
    <div class="field">
      <label for="fileInput">Choose HEIC or HEIF file</label>
      <input type="file" id="fileInput" accept=".heic,.heif,image/heic,image/heif">
    </div>

    <div class="field">
      <label for="format">Convert to</label>
      <select id="format">
        <option value="image/jpeg">JPG (smallest, best for forms)</option>
        <option value="image/png">PNG (lossless, larger)</option>
        <option value="image/webp">WebP (modern, small)</option>
      </select>
    </div>

    <button id="processBtn" disabled>Convert Now</button>

    <div id="status">Upload a HEIC file to begin.</div>
    <img id="preview" alt="Preview">
    <a id="downloadLink" href="#" download>Download Converted Image</a>
  </div>

  <p class="note">
    Works fully in your browser. No server upload. Free for single images.
  </p>
</main>

<footer class="site">
  Designed &amp; built by Nasir Naqvi
</footer>

<script>
  const fileInput = document.getElementById('fileInput');
  const format = document.getElementById('format');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('downloadLink');

  let selectedFile = null;
  let originalFileName = 'image';

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    selectedFile = file;
    originalFileName = file.name.replace(/\.[^.]+$/, '');
    processBtn.disabled = false;
    downloadLink.style.display = 'none';
    preview.style.display = 'none';
    statusEl.textContent = 'Loaded: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
  });

  processBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    const targetFormat = format.value;
    const ext = targetFormat === 'image/jpeg' ? 'jpg'
              : targetFormat === 'image/png'  ? 'png'
              : 'webp';

    processBtn.disabled = true;
    statusEl.textContent = 'Converting…';

    try {
      // Use heic2any to decode HEIC into a JPEG blob first
      const converted = await heic2any({
        blob: selectedFile,
        toType: 'image/jpeg',
        quality: 0.92
      });

      const jpegBlob = Array.isArray(converted) ? converted[0] : converted;

      // If user wants JPG, we're done. For PNG/WebP, re-encode via canvas.
      let finalBlob = jpegBlob;

      if (targetFormat !== 'image/jpeg') {
        finalBlob = await reencode(jpegBlob, targetFormat);
      }

      const url = URL.createObjectURL(finalBlob);
      preview.src = url;
      preview.style.display = 'block';
      downloadLink.href = url;
      downloadLink.download = originalFileName + '.' + ext;
      downloadLink.style.display = 'block';
      statusEl.textContent = 'Done: ' + (finalBlob.size / 1024).toFixed(1) + ' KB as ' + ext.toUpperCase();
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Conversion failed. Make sure the file is a real HEIC photo.';
    }

    processBtn.disabled = false;
  });

  function reencode(blob, type) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob((out) => resolve(out), type, 0.92);
      };
      img.src = url;
    });
  }
</script>

</body>
</html>
