<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEIC to JPG Converter - ResizeHub</title>
  <meta name="description" content="Convert iPhone HEIC photos to JPG, PNG or WebP online. Free, private, no upload.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CKBKJ6MEWP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CKBKJ6MEWP');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .tool-card { background: var(--rh-surface); border: 1px solid var(--rh-border); border-radius: var(--rh-radius-lg); padding: 28px; box-shadow: var(--rh-shadow); }
    .tool-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; color: var(--rh-text); }
    .tool-card .subtitle { color: var(--rh-muted); font-size: 0.95rem; margin: 0 0 22px; }
    .tool-badge { display: inline-block; padding: 5px 12px; background: rgba(37,99,235,0.08); color: var(--rh-primary-dark); border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 14px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; color: var(--rh-text); }
    .field input[type="file"], .field select { width: 100%; padding: 12px 14px; border: 1px solid var(--rh-border); border-radius: 10px; font-size: 1rem; background: #fff; font-family: inherit; color: var(--rh-text); transition: border-color 0.15s, box-shadow 0.15s; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--rh-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .btn-primary { background: linear-gradient(135deg, var(--rh-primary) 0%, var(--rh-primary-light) 100%); color: #fff; border: none; padding: 14px 22px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; box-shadow: 0 4px 14px rgba(37,99,235,0.25); transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.32); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    #status { margin-top: 16px; font-size: 0.93rem; color: var(--rh-muted); min-height: 22px; text-align: center; }
    #preview { display: none; max-width: 100%; max-height: 340px; margin: 18px auto 0; border-radius: 12px; border: 1px solid var(--rh-border); object-fit: contain; background: #f1f5f9; padding: 8px; }
    #downloadLink { display: none; margin-top: 18px; text-align: center; background: linear-gradient(135deg, #ecfdf5, #dbeafe); color: var(--rh-primary-dark); padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(37,99,235,0.2); }
    #downloadLink:hover { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .tool-note { max-width: 720px; margin: 22px auto 0; font-size: 0.85rem; color: var(--rh-muted); text-align: center; line-height: 1.6; }
    .tool-note strong { color: var(--rh-primary-dark); }
  </style>
</head>
<body>
<main class="rh-main-tool">
  <div class="tool-card">
    <span class="tool-badge">HEIC, HEIF support</span>
    <h1>HEIC to JPG Converter</h1>
    <p class="subtitle">Convert iPhone HEIC photos to JPG, PNG or WebP. Nothing is uploaded - conversion happens in your browser.</p>

    <div class="field">
      <label for="fileInput">Choose HEIC or HEIF file</label>
      <input type="file" id="fileInput" accept=".heic,.heif,image/heic,image/heif">
    </div>

    <div class="field">
      <label for="format">Convert to</label>
      <select id="format">
        <option value="image/jpeg">JPG (smallest, best for forms)</option>
        <option value="image/png">PNG (lossless, larger)</option>
        <option value="image/webp">WebP (modern, small)</option>
      </select>
    </div>

    <button class="btn-primary" id="processBtn" disabled>Convert Now</button>

    <div id="status">Upload a HEIC file to begin.</div>
    <img id="preview" alt="Preview">
    <a id="downloadLink" href="#" download>Download Converted Image</a>
  </div>
  <p class="tool-note"><strong>100% private.</strong> Your file is processed entirely in your browser and never sent to a server.</p>
</main>

<script>
  const fileInput = document.getElementById('fileInput');
  const format = document.getElementById('format');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('downloadLink');
  let selectedFile = null;
  let originalFileName = 'image';

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    selectedFile = file;
    originalFileName = file.name.replace(/\.[^.]+$/, '');
    processBtn.disabled = false;
    downloadLink.style.display = 'none';
    preview.style.display = 'none';
    statusEl.textContent = 'Loaded: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
  });

  processBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    const targetFormat = format.value;
    const ext = targetFormat === 'image/jpeg' ? 'jpg' : targetFormat === 'image/png' ? 'png' : 'webp';
    processBtn.disabled = true;
    statusEl.textContent = 'Converting...';
    try {
      const converted = await heic2any({ blob: selectedFile, toType: 'image/jpeg', quality: 0.92 });
      const jpegBlob = Array.isArray(converted) ? converted[0] : converted;
      let finalBlob = jpegBlob;
      if (targetFormat !== 'image/jpeg') finalBlob = await reencode(jpegBlob, targetFormat);
      const url = URL.createObjectURL(finalBlob);
      preview.src = url;
      preview.style.display = 'block';
      downloadLink.href = url;
      downloadLink.download = originalFileName + '.' + ext;
      downloadLink.style.display = 'block';
      statusEl.textContent = 'Done: ' + (finalBlob.size / 1024).toFixed(1) + ' KB as ' + ext.toUpperCase();
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Conversion failed. Make sure the file is a real HEIC photo.';
    }
    processBtn.disabled = false;
  });

  function reencode(blob, type) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob((out) => resolve(out), type, 0.92);
      };
      img.src = url;
    });
  }
</script>
<script src="/assets/js/site.js"></script>
</body>
</html>
