<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG to PDF Converter - ResizeHub</title>
  <meta name="description" content="Combine JPG images into a single PDF in your browser. Free, private, no upload.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YF9S33NXBS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YF9S33NXBS');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .tool-card { background: var(--rh-surface); border: 1px solid var(--rh-border); border-radius: var(--rh-radius-lg); padding: 28px; box-shadow: var(--rh-shadow); }
    .tool-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; color: var(--rh-text); }
    .tool-card .subtitle { color: var(--rh-muted); font-size: 0.95rem; margin: 0 0 22px; }
    .tool-badge { display: inline-block; padding: 5px 12px; background: rgba(37,99,235,0.08); color: var(--rh-primary-dark); border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 14px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; color: var(--rh-text); }
    .field input[type="file"], .field input[type="text"], .field select { width: 100%; padding: 12px 14px; border: 1px solid var(--rh-border); border-radius: 10px; font-size: 1rem; background: #fff; font-family: inherit; color: var(--rh-text); transition: border-color 0.15s, box-shadow 0.15s; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--rh-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .btn-primary { background: linear-gradient(135deg, var(--rh-primary) 0%, var(--rh-primary-light) 100%); color: #fff; border: none; padding: 14px 22px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; box-shadow: 0 4px 14px rgba(37,99,235,0.25); transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.32); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    #status { margin-top: 16px; font-size: 0.93rem; color: var(--rh-muted); min-height: 22px; text-align: center; }
    #downloadLink { display: none; margin-top: 18px; text-align: center; background: linear-gradient(135deg, #ecfdf5, #dbeafe); color: var(--rh-primary-dark); padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 1px solid rgba(37,99,235,0.2); }
    #downloadLink:hover { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .file-list { margin-top: 12px; border: 1px solid var(--rh-border); border-radius: 10px; background: #fff; overflow: hidden; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--rh-border); font-size: 0.92rem; }
    .file-item:last-child { border-bottom: none; }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
    .file-item .size { color: var(--rh-muted); font-size: 0.85rem; margin-right: 12px; }
    .file-item button.remove { background: #fbe6e6; color: #b12929; padding: 5px 10px; width: auto; font-size: 0.8rem; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; }
    .empty-msg { padding: 14px; color: var(--rh-muted); font-size: 0.9rem; text-align: center; }
    .tool-note { max-width: 720px; margin: 22px auto 0; font-size: 0.85rem; color: var(--rh-muted); text-align: center; line-height: 1.6; }
    .tool-note strong { color: var(--rh-primary-dark); }
  </style>
</head>
<body>
<main class="rh-main-tool">
  <div class="tool-card">
    <span class="tool-badge">Images to PDF</span>
    <h1>JPG to PDF</h1>
    <p class="subtitle">Combine JPG images into a single PDF. Nothing is uploaded.</p>

    <div class="field">
      <label for="fileInput">Choose JPG or PNG images (multiple allowed)</label>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple>
    </div>

    <div id="fileList" class="file-list"><div class="empty-msg">No images added yet.</div></div>

    <div class="field" style="margin-top: 18px;">
      <label for="outputName">Output filename (without .pdf)</label>
      <input type="text" id="outputName" value="images">
    </div>

    <div class="field">
      <label for="pageSize">Page size</label>
      <select id="pageSize">
        <option value="fit">Fit image (page matches image size)</option>
        <option value="a4">A4 (image centered on A4 page)</option>
      </select>
    </div>

    <button class="btn-primary" id="processBtn" disabled>Create PDF</button>
    <div id="status">Add at least 1 image.</div>
    <a id="downloadLink" href="#" download>Download PDF</a>
  </div>
  <p class="tool-note"><strong>100% private.</strong> Files never leave your device.</p>
</main>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const outputName = document.getElementById('outputName');
  const pageSize = document.getElementById('pageSize');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const downloadLink = document.getElementById('downloadLink');
  let files = [];

  fileInput.addEventListener('change', (e) => {
    files = files.concat(Array.from(e.target.files));
    renderList();
    fileInput.value = '';
  });

  function renderList() {
    fileList.innerHTML = '';
    if (files.length === 0) {
      fileList.innerHTML = '<div class="empty-msg">No images added yet.</div>';
      processBtn.disabled = true;
      statusEl.textContent = 'Add at least 1 image.';
      downloadLink.style.display = 'none';
      return;
    }
    files.forEach((file, index) => {
      const row = document.createElement('div');
      row.className = 'file-item';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = file.name;
      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = (file.size / 1024).toFixed(1) + ' KB';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = 'Remove';
      removeBtn.addEventListener('click', () => { files.splice(index, 1); renderList(); });
      row.appendChild(name); row.appendChild(size); row.appendChild(removeBtn);
      fileList.appendChild(row);
    });
    processBtn.disabled = false;
    statusEl.textContent = files.length + ' image(s) ready.';
  }

  processBtn.addEventListener('click', async () => {
    if (files.length === 0) return;
    processBtn.disabled = true;
    statusEl.textContent = 'Building PDF...';
    try {
      const { PDFDocument } = PDFLib;
      const pdfDoc = await PDFDocument.create();
      const a4W = 595.28, a4H = 841.89;
      for (const file of files) {
        const bytes = await file.arrayBuffer();
        let img;
        if (file.type === 'image/png') img = await pdfDoc.embedPng(bytes);
        else img = await pdfDoc.embedJpg(bytes);
        if (pageSize.value === 'a4') {
          const page = pdfDoc.addPage([a4W, a4H]);
          const margin = 40;
          const maxW = a4W - margin * 2, maxH = a4H - margin * 2;
          const scale = Math.min(maxW / img.width, maxH / img.height);
          const w = img.width * scale, h = img.height * scale;
          page.drawImage(img, { x: (a4W - w) / 2, y: (a4H - h) / 2, width: w, height: h });
        } else {
          const page = pdfDoc.addPage([img.width, img.height]);
          page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
        }
      }
      const bytes = await pdfDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      downloadLink.download = (outputName.value || 'images').trim() + '.pdf';
      downloadLink.style.display = 'block';
      statusEl.textContent = 'Done: ' + (blob.size / 1024).toFixed(1) + ' KB total.';
    } catch (err) { console.error(err); statusEl.textContent = 'Something went wrong.'; }
    processBtn.disabled = false;
  });
</script>
<script src="/assets/js/site.js"></script>
</body>
</html>
