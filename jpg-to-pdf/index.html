<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Combine JPG images into a single PDF in your browser. Free, private, no upload.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YF9S33NXBS"></script>
  <script>

  <style>
    :root { --primary: #0b6e4f; --primary-dark: #07543c; --bg: #f7f9f8; --card: #ffffff; --text: #1a1a1a; --muted: #5f6b66; --border: #dde5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
    header.site { max-width: 860px; margin: 0 auto 24px; text-align: center; }
    header.site h1 { font-size: 1.7rem; color: var(--primary-dark); margin-bottom: 8px; }
    header.site p { color: var(--muted); font-size: 0.95rem; }
    nav.site { max-width: 860px; margin: 0 auto 24px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 0.95rem; }
    nav.site a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }
    nav.site a:hover { text-decoration: underline; }
    main { flex: 1; }
    .card { max-width: 860px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    input[type="file"], input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: #fff; font-family: inherit; }
    button { background: var(--primary); color: #fff; border: none; padding: 13px 22px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; font-family: inherit; }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 0.95rem; color: var(--muted); min-height: 22px; }
    #downloadLink { display: none; margin-top: 16px; text-align: center; background: #e8f5ef; color: var(--primary-dark); padding: 12px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    #downloadLink:hover { background: #d4ede0; }
    .file-list { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; overflow: hidden; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    .file-item:last-child { border-bottom: none; }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
    .file-item .size { color: var(--muted); font-size: 0.85rem; margin-right: 12px; }
    .file-item button.remove { background: #fbe6e6; color: #b12929; padding: 5px 10px; width: auto; font-size: 0.8rem; font-weight: 700; }
    .file-item button.remove:hover { background: #f7d4d4; }
    .empty-msg { padding: 14px; color: var(--muted); font-size: 0.9rem; text-align: center; }
    .note { max-width: 860px; margin: 22px auto 0; font-size: 0.88rem; color: var(--muted); text-align: center; }
    footer.site { max-width: 860px; margin: 40px auto 0; text-align: center; font-size: 0.88rem; color: var(--muted); padding-top: 20px; border-top: 1px solid var(--border); }
    @media (max-width: 600px) { header.site h1 { font-size: 1.4rem; } .card { padding: 18px; } }
  </style>
</head>
<body>
<header class="site">
  <h1>JPG to PDF Converter</h1>
  <p>Combine JPG images into a single PDF. 100% private â€” no upload.</p>
</header>
<nav class="site">
  <a href="/">Home</a>
  <a href="/pdf-merge/">Merge</a>
  <a href="/pdf-split/">Split</a>
  <a href="/pdf-compress/">Compress</a>
  <a href="/pdf-to-jpg/">PDFâ†’JPG</a>
  <a href="/jpg-to-pdf/">JPGâ†’PDF</a>
</nav>
<main>
  <div class="card">
    <div class="field">
      <label for="fileInput">Choose JPG or PNG images (multiple allowed)</label>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple>
    </div>
    <div id="fileList" class="file-list"><div class="empty-msg">No images added yet.</div></div>
    <div class="field" style="margin-top: 18px;">
      <label for="outputName">Output filename (without .pdf)</label>
      <input type="text" id="outputName" value="images" placeholder="images">
    </div>
    <div class="field">
      <label for="pageSize">Page size</label>
      <select id="pageSize">
        <option value="fit">Fit image (page matches image size)</option>
        <option value="a4">A4 (image centered on A4 page)</option>
      </select>
    </div>
    <button id="processBtn" disabled>Create PDF</button>
    <div id="status">Add at least 1 image.</div>
    <a id="downloadLink" href="#" download>Download PDF</a>
  </div>
  <p class="note">Works fully in your browser. Files never leave your device.</p>
</main>
<footer class="site">Designed &amp; built by Nasir Naqvi</footer>
<script>
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const outputName = document.getElementById('outputName');
  const pageSize = document.getElementById('pageSize');
  const processBtn = document.getElementById('processBtn');
  const statusEl = document.getElementById('status');
  const downloadLink = document.getElementById('downloadLink');

  let files = [];

  fileInput.addEventListener('change', (e) => {
    files = files.concat(Array.from(e.target.files));
    renderList();
    fileInput.value = '';
  });

  function renderList() {
    fileList.innerHTML = '';
    if (files.length === 0) {
      fileList.innerHTML = '<div class="empty-msg">No images added yet.</div>';
      processBtn.disabled = true;
      statusEl.textContent = 'Add at least 1 image.';
      downloadLink.style.display = 'none';
      return;
    }
    files.forEach((file, index) => {
      const row = document.createElement('div');
      row.className = 'file-item';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = file.name;
      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = (file.size / 1024).toFixed(1) + ' KB';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = 'Remove';
      removeBtn.addEventListener('click', () => { files.splice(index, 1); renderList(); });
      row.appendChild(name); row.appendChild(size); row.appendChild(removeBtn);
      fileList.appendChild(row);
    });
    processBtn.disabled = false;
    statusEl.textContent = files.length + ' image(s) ready.';
  }

  processBtn.addEventListener('click', async () => {
    if (files.length === 0) return;
    processBtn.disabled = true;
    statusEl.textContent = 'Building PDFâ€¦';

    try {
      const { PDFDocument } = PDFLib;
      const pdfDoc = await PDFDocument.create();
      const a4W = 595.28, a4H = 841.89;

      for (const file of files) {
        const bytes = await file.arrayBuffer();
        let img;
        if (file.type === 'image/png') img = await pdfDoc.embedPng(bytes);
        else img = await pdfDoc.embedJpg(bytes);

        if (pageSize.value === 'a4') {
          const page = pdfDoc.addPage([a4W, a4H]);
          const margin = 40;
          const maxW = a4W - margin * 2, maxH = a4H - margin * 2;
          const scale = Math.min(maxW / img.width, maxH / img.height);
          const w = img.width * scale, h = img.height * scale;
          page.drawImage(img, { x: (a4W - w) / 2, y: (a4H - h) / 2, width: w, height: h });
        } else {
          const page = pdfDoc.addPage([img.width, img.height]);
          page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
        }
      }

      const bytes = await pdfDoc.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      downloadLink.download = (outputName.value || 'images').trim() + '.pdf';
      downloadLink.style.display = 'block';
      statusEl.textContent = 'Done: ' + (blob.size / 1024).toFixed(1) + ' KB total.';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Something went wrong.';
    }
    processBtn.disabled = false;
  });
</script>
</body>
</html>
